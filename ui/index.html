<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Developable Unfold Prototype</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c2027; --panel2: #232833; --line: #333a47;
    --text: #d7dee8; --muted: #8b95a5; --accent: #6db3f2; --good: #5fd08a;
    --warn: #f0b866; --bad: #ef6b6b; --tab: #e0a44a; --slit: #ef6b6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
  #app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
  #side { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px; }
  #main { display: grid; grid-template-rows: 1fr 1fr; min-width: 0; }
  #views { display: grid; grid-template-columns: 1fr 1fr; }
  .view { position: relative; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
  .view:last-child { border-right: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .label { position: absolute; top: 8px; left: 10px; color: var(--muted); font-size: 11px;
    letter-spacing: .04em; text-transform: uppercase; pointer-events: none; }
  h1 { font-size: 13px; margin: 0 0 4px; letter-spacing: .04em; }
  .sub { color: var(--muted); font-size: 11px; margin-bottom: 12px; }
  .group { margin-bottom: 14px; }
  .group > .hd { color: var(--muted); font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .06em; margin-bottom: 6px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  select, input[type=number], button { width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; font: inherit; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .row label { flex: 0 0 96px; color: var(--muted); font-size: 11px; }
  .row input, .row select { flex: 1; }
  .btnrow { display: flex; gap: 6px; }
  .btnrow button { flex: 1; }
  #status { font-size: 11px; line-height: 1.6; }
  #status .k { color: var(--muted); }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 10.5px; }
  .pill.good { background: rgba(95,208,138,.15); color: var(--good); border: 1px solid rgba(95,208,138,.35); }
  .pill.bad { background: rgba(239,107,107,.15); color: var(--bad); border: 1px solid rgba(239,107,107,.35); }
  .pill.warn { background: rgba(240,184,102,.15); color: var(--warn); border: 1px solid rgba(240,184,102,.35); }
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  td { padding: 2px 0; }
  td:last-child { text-align: right; color: var(--text); }
  #log { position: relative; overflow-y: auto; padding: 34px 12px 12px; }
  #log pre { margin: 0; font-size: 11.5px; white-space: pre-wrap; color: var(--muted); }
  .hint { color: var(--muted); font-size: 10.5px; margin-top: 4px; }
  #legend { position: absolute; bottom: 8px; left: 10px; font-size: 10.5px; color: var(--muted); }
  #legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <h1>DEVELOPABLE UNFOLD</h1>
    <div class="sub">ruled form &rarr; measured developability &rarr; isometric flat pattern &rarr; tab layout</div>

    <div class="group">
      <div class="hd">Preset</div>
      <select id="preset"></select>
      <div class="hint" id="presetNote"></div>
    </div>

    <div class="group">
      <div class="hd">Parameters</div>
      <div class="row"><label>u samples</label><input id="pNu" type="number" min="8" max="400" step="4"></div>
      <div class="row"><label>v samples</label><input id="pNv" type="number" min="2" max="24" step="1"></div>
      <div class="row"><label>tab depth</label><input id="pTabDepth" type="number" min="0.05" max="0.6" step="0.02"></div>
      <div class="row"><label>tabs / seam</label><input id="pNTabs" type="number" min="1" max="8" step="1"></div>
      <div class="row"><label>angle tol</label><input id="pAngleTol" type="number" min="1e-6" max="1" step="1e-5" value="1e-3"></div>
    </div>

    <div class="group">
      <div class="hd">Diagnostics</div>
      <div id="status"></div>
    </div>

    <div class="group">
      <div class="hd">Tab layout</div>
      <div id="layout"></div>
    </div>

    <div class="group">
      <div class="hd">Slide / segment (near-parallel)</div>
      <div class="row"><label>pieces</label><input id="pSegs" type="number" min="1" max="8" step="1" value="1"></div>
      <button id="btnTradeoff">Compare segment vs slit</button>
      <div class="hint" id="tradeoffOut"></div>
    </div>

    <div class="group">
      <div class="hd">A/B: whole vs re-sliced</div>
      <button id="btnAB">Compare whole vs split</button>
      <div class="hint" id="abOut"></div>
    </div>

    <div class="group">
      <div class="hd">Export</div>
      <div class="btnrow">
        <button id="btnObj">OBJ</button>
        <button id="btnJson">Params</button>
        <button id="btnPng">PNG</button>
      </div>
    </div>
  </aside>

  <main id="main">
    <div id="views">
      <div class="view"><canvas id="c3d"></canvas><div class="label">3D form</div><div id="legend"></div></div>
      <div class="view"><canvas id="c2d"></canvas><div class="label">flat pattern + tabs</div></div>
    </div>
    <div id="log"><pre id="logtext"></pre></div>
  </main>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
